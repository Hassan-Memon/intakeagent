[project]
name = "intakeagent"
version = "0.1.0"
description = "Voice-first AI intake for clinics and law firms: LangGraph agent, FHIR R4 and Clio exporters, HITL approval."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Hassan Memon" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "langgraph>=0.2.60",
  "langchain-core>=0.3.20",
  "langchain-openai>=0.2.10",
  "fhir.resources>=7.1",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# Local speech-to-text. CPU works for the "base" model; GPU is optional.
stt-local = ["faster-whisper>=1.0"]
# Stronger PHI detection on top of the regex layer.
presidio = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["intakeagent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
