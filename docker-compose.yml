# IntakeAgent local stack. `docker compose up` works with zero API keys because
# DEMO_MODE defaults to 1 (scripted STT, rule-based extraction, mock exporters).
#
# Profiles:
#   default        postgres (pgvector) + backend + frontend
#   local-llm      adds Ollama so DEMO_MODE=0 can use a local model (no PHI leaves the box)
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: intake
      POSTGRES_PASSWORD: intake
      POSTGRES_DB: intakeagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intake -d intakeagent"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DEMO_MODE: ${DEMO_MODE:-1}
      DATABASE_URL: postgresql+psycopg://intake:intake@postgres:5432/intakeagent
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
      OPENINFER_BASE_URL: ${OPENINFER_BASE_URL:-}
      OPENINFER_API_KEY: ${OPENINFER_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ALLOW_CLOUD_LLM: ${ALLOW_CLOUD_LLM:-0}
      STT_PROVIDER: ${STT_PROVIDER:-auto}
      FHIR_PUSH: ${FHIR_PUSH:-0}
      FHIR_BASE_URL: ${FHIR_BASE_URL:-https://hapi.fhir.org/baseR4}
      CLIO_BASE_URL: ${CLIO_BASE_URL:-https://app.clio.com}
      CLIO_CLIENT_ID: ${CLIO_CLIENT_ID:-}
      CLIO_CLIENT_SECRET: ${CLIO_CLIENT_SECRET:-}
      CLIO_ACCESS_TOKEN: ${CLIO_ACCESS_TOKEN:-}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
